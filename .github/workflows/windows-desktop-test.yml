name: Desktop App Robot Test

on:
  push:
    branches: [ main ]

jobs:
  robot-tests:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Check Python environment variables
        run: |
         echo $Env:Path
         where python
         where pip
         python --version
         pip --version
        shell: powershell
      
      - name: Run Robot Framework tests
        run: |
          robot tests/
